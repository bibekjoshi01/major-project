{
    "seed": 1234,
    "device": "auto",
    "output_dir": "baselines/runs/rawnet2",
    "eval_output": "baselines/runs/rawnet2/eval_scores.txt",
    "cudnn_deterministic_toggle": true,
    "cudnn_benchmark_toggle": false,
    "data": {
        "database_path": "data/asvspoof5",
        "max_len": 64600,
        "manifests": {
            "train": "train.jsonl",
            "dev": "dev.jsonl",
            "eval": "eval.jsonl"
        }
    },
    "training": {
        "experiment_name": "rawnet2_baseline",
        "batch_size": 32,
        "num_epochs": 100,
        "num_workers": 4,
        "drop_last": true,
        "pin_memory": true,
        "grad_clip": 5.0
    },
    "optimizer": {
        "name": "adam",
        "lr": 0.0001,
        "weight_decay": 0.0001,
        "scheduler": "none"
    },
    "loss": {
        "name": "cross_entropy",
        "class_weights": [0.1, 0.9]
    },
    "metrics": {
        "positive_label": 1
    }
}
