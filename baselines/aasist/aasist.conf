{
    "seed": 1234,
    "device": "auto",
    "output_dir": "baselines/runs/aasist",
    "eval_output": "baselines/runs/aasist/eval_scores.txt",
    "cudnn_deterministic_toggle": true,
    "cudnn_benchmark_toggle": false,
    "data": {
        "database_path": "data/asvspoof5",
        "max_len": 64600,
        "sample_rate": 16000,
        "manifests": {
            "train": "train.jsonl",
            "dev": "dev.jsonl",
            "eval": "eval.jsonl"
        },
        "rtc": {
            "enabled": true,
            "clean_prob": 0.18,
            "active_profiles": [
                "whatsapp_opus_wb",
                "mobile_lossy_opus",
                "pstn_g711",
                "voice_note_mp3",
                "voice_note_aac"
            ],
            "degrade_eval": false,
            "ffmpeg_bin": "ffmpeg",
            "ffmpeg_timeout": 8.0
        }
    },
    "training": {
        "experiment_name": "aasist_baseline",
        "batch_size": 24,
        "num_epochs": 100,
        "num_workers": 4,
        "drop_last": true,
        "pin_memory": true,
        "grad_clip": 5.0,
        "freq_aug": false
    },
    "optimizer": {
        "name": "adam",
        "lr": 0.0001,
        "lr_min": 0.000005,
        "betas": [0.9, 0.999],
        "weight_decay": 0.0001,
        "amsgrad": false,
        "scheduler": "cosine"
    },
    "loss": {
        "name": "cross_entropy",
        "class_weights": [0.1, 0.9]
    },
    "metrics": {
        "positive_label": 1
    },
    "model_config": {
        "nb_samp": 64600,
        "first_conv": 128,
        "filts": [70, [1, 32], [32, 32], [32, 64], [64, 64]],
        "gat_dims": [64, 32],
        "pool_ratios": [0.5, 0.7, 0.5, 0.5],
        "temperatures": [2.0, 2.0, 100.0, 100.0]
    }
}
